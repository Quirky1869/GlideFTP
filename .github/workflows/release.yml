name: Release

# Triggers:
#   - Push of a tag matching v1.2.3  → full build + draft GitHub release
#   - Manual dispatch               → same, version typed in the UI
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (X.Y.Z — without the v prefix)'
        required: true
        type: string

env:
  GO_VERSION: '1.25.0'

jobs:
  release:
    runs-on: ubuntu-22.04

    permissions:
      contents: write   # required to create the GitHub release

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Determine version ────────────────────────────────────────────────────
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Strip the leading 'v' from the tag name
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # ── Toolchain ────────────────────────────────────────────────────────────
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            gcc \
            pkg-config \
            mingw-w64 \
            imagemagick

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ── Native builds ────────────────────────────────────────────────────────
      - name: Build Linux binary
        run: ./make.sh linux ${{ steps.ver.outputs.version }}

      - name: Build Windows binary
        run: ./make.sh windows ${{ steps.ver.outputs.version }}

      # ── Docker-based builds ──────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu 22.04 builder image (AppImage + .deb)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.appimage
          load: true
          tags: glideftp-debian-builder:latest
          cache-from: type=gha,scope=debian-builder
          cache-to: type=gha,mode=max,scope=debian-builder

      - name: Build Debian AppImage
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            glideftp-debian-builder \
            bash /src/docker/build-appimage.sh ${{ steps.ver.outputs.version }}

      - name: Build .deb package
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            glideftp-debian-builder \
            bash /src/docker/build-deb.sh ${{ steps.ver.outputs.version }}

      - name: Build Fedora 40 builder image (.rpm)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.rpm
          load: true
          tags: glideftp-rpm-builder:latest
          cache-from: type=gha,scope=rpm-builder
          cache-to: type=gha,mode=max,scope=rpm-builder

      - name: Build .rpm package
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            glideftp-rpm-builder \
            bash /src/docker/build-rpm.sh ${{ steps.ver.outputs.version }}

      # ── Archives ─────────────────────────────────────────────────────────────
      - name: Create distribution archives
        run: ./create-archive.sh ${{ steps.ver.outputs.version }}

      # ── Release notes ─────────────────────────────────────────────────────────
      - name: Prepare release body
        id: body
        run: |
          NOTES="v${{ steps.ver.outputs.version }}.md"
          if [ -f "$NOTES" ]; then
            {
              echo 'content<<RELEASE_BODY_EOF'
              cat "$NOTES"
              echo 'RELEASE_BODY_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "content=GlideFTP v${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # ── GitHub Release ────────────────────────────────────────────────────────
      # Creates a DRAFT release — review it on GitHub before clicking "Publish".
      # The Arch AppImage is NOT built here (it requires Arch Linux libs).
      # Build it locally with ./make.sh appimage-arch then upload it to the draft manually.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: "GlideFTP v${{ steps.ver.outputs.version }}"
          tag_name: "v${{ steps.ver.outputs.version }}"
          draft: true
          prerelease: false
          body: ${{ steps.body.outputs.content }}
          files: |
            GlideFTP-Linux-v${{ steps.ver.outputs.version }}.tar.gz
            GlideFTP-Linux-v${{ steps.ver.outputs.version }}.tar
            GlideFTP-Windows-v${{ steps.ver.outputs.version }}.tar.gz
            GlideFTP-Windows-v${{ steps.ver.outputs.version }}.tar
            GlideFTP-Linux-Debian-AppImage-v${{ steps.ver.outputs.version }}.tar.gz
            GlideFTP-Linux-Debian-AppImage-v${{ steps.ver.outputs.version }}.tar
            build/bin/linux/GlideFTP-Linux-v${{ steps.ver.outputs.version }}.deb
            build/bin/linux/GlideFTP-Linux-v${{ steps.ver.outputs.version }}.rpm
